          - name: Multi-stage builds
            summary: Smaller production images with separated build and runtime dependencies.
          - name: Layer optimization
            summary: Efficient caching and dependency organization for faster builds.
      - name: Runtime operations
        summary: Practical container operation across development and production workflows.
        subskills:
          - name: Networking and volumes
            summary: Service connectivity and persistent data management.
          - name: Logs and troubleshooting
            summary: Runtime inspection, dependency analysis, and failure diagnosis.
      - name: Delivery
        summary: Containers integrated into automated platform workflows.
        subskills:
