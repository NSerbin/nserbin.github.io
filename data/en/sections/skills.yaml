skills:
  - name: Ansible
    logo: "/images/sections/skills/ansible.png"
    summary: "Automation of provisioning and configuration tasks through playbooks."
    categories: ["iac"]
    details:
      - name: Playbooks and roles
        summary: Repeatable configuration built for safe, controlled execution.
        expanded: true
        subskills:
          - name: Idempotent playbooks
            summary: Consistent provisioning and configuration across repeated runs.
          - name: Reusable roles
            summary: Structured tasks, defaults, handlers, templates, and variables.
          - name: Environment management
            summary: Inventories and environment-aware configuration for controlled rollouts.
      - name: Operations and observability
        summary: Automation that improves visibility and reduces manual maintenance.
        subskills:
          - name: CloudWatch logging
            summary: Standardized installation and configuration of log collection components.
          - name: Operational automation
            summary: Repeatable maintenance, validation, and troubleshooting workflows.

  - name: ArgoCD
    logo: "/images/sections/skills/argo-color.svg"
    summary: "Declarative GitOps tool for Kubernetes continuous delivery."
    categories: ["ci-cd"]
    details:
      - name: GitOps delivery
        summary: Declarative application delivery driven by version-controlled desired state.
        expanded: true
        subskills:
          - name: Application synchronization
            summary: Automated reconciliation between Git repositories and Kubernetes clusters.
          - name: Environment promotion
            summary: Traceable configuration changes across deployment environments.
      - name: Operations
        summary: Visibility and control over application health and deployment state.
        subskills:
          - name: Health and sync status
            summary: Detecting drift, failed resources, and out-of-sync applications.
          - name: Rollback workflows
            summary: Recovering known-good application states from version control.

  - name: AWS
    logo: "/images/sections/skills/aws.png"
    summary: "Provisioning, scaling, and managing cloud infrastructure (EC2, S3, Lambda, etc)."
    categories: ["cloud"]
    details:
      - name: Compute and serverless
        summary: Scalable compute foundations and event-driven automation.
        expanded: true
        subskills:
          - name: EC2
            summary: Provisioning, lifecycle management, scaling, and troubleshooting of compute workloads.
            subskills:
              - name: Launch Templates
                summary: Repeatable instance configuration and versioned infrastructure definitions.
              - name: Auto Scaling
                summary: Capacity policies, health checks, and resilient workload scaling.
          - name: Lambda
            summary: Serverless solutions for operational workflows and service integrations.
            subskills:
              - name: Event-driven automation
                summary: Functions triggered by cloud events and operational changes.
              - name: Execution roles
                summary: Least-privilege permissions tailored to each function.
      - name: Storage and data
        summary: Durable storage, lifecycle policies, and automated data operations.
        subskills:
          - name: S3
            summary: Bucket policies, versioning, lifecycle management, and backup workflows.
            subskills:
              - name: Batch operations with boto3
                summary: Python automation for large-scale object discovery and processing.
              - name: Lifecycle and retention
                summary: Storage policies aligned with operational and cost requirements.
          - name: RDS
            summary: Database operations, backup workflows, and exports to S3.
      - name: Networking and DNS
        summary: Secure connectivity and reliable service resolution.
        subskills:
          - name: VPC networking
            summary: Subnets, routing, security groups, and connectivity troubleshooting.
          - name: DNS management
            summary: Operational ownership and automation of cloud DNS changes.
      - name: Security and governance
        summary: Access control and infrastructure controls designed for auditable environments.
        subskills:
          - name: IAM
            summary: Roles, policies, service permissions, and least-privilege access.
          - name: Infrastructure audits
            summary: Evidence gathering, remediation, and technical ownership for SAP audits.
      - name: Observability and reliability
        summary: Monitoring and operational practices that keep cloud platforms healthy.
        subskills:
          - name: CloudWatch
            summary: Logs, metrics, dashboards, alarms, retention, and incident troubleshooting.
          - name: Backup and recovery
            summary: Backup strategies and operational checks focused on recoverability.

  - name: Cloudflare
    logo: "/images/sections/skills/cloudflare-color.svg"
    summary: "DNS, CDN, email routing, Zero Trust, tunnels, and API-based automation."
