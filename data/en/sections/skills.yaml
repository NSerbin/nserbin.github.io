            summary: Records, routing changes, validation, and operational ownership.
          - name: CDN and proxying
            summary: Edge delivery, caching, and protected origin connectivity.
          - name: Email routing
            summary: Domain-level routing configuration and maintenance.
      - name: Secure connectivity
        summary: Controlled access to internal services without exposing infrastructure directly.
        subskills:
          - name: Zero Trust
            summary: Identity-aware access policies for protected resources.
          - name: Cloudflare Tunnels
            summary: Secure outbound connectivity between services and the Cloudflare edge.
      - name: Automation
        summary: Repeatable changes delivered as code.
        subskills:
          - name: Terraform provider
            summary: Versioned and reviewable Cloudflare configuration.
          - name: Cloudflare APIs
            summary: Scripted workflows for operational changes and integrations.

