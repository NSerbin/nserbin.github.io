# a summary about you
summary: "I don't just build cloud infrastructure — I engineer the foundations that let ideas scale. As a Senior Cloud Engineer, I turn complex challenges into secure, reliable, and automated platforms by combining infrastructure as code, observability, and a constant drive to improve. That curiosity continues beyond production: in my self-hosted Kubernetes cluster, I experiment, break things, rebuild them, and turn every lesson into something stronger. For me, technology is more than systems and code; it is a way to create meaningful, lasting impact. My ambition is to leave a mark on the world through my profession — by building solutions that endure, sharing what I learn, and helping others grow along the way."

