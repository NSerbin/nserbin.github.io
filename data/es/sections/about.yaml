# a summary about you
summary: "No solo construyo infraestructura cloud: diseño los cimientos que permiten que las ideas escalen. Como Senior Cloud Engineer, convierto desafíos complejos en plataformas seguras, confiables y automatizadas, combinando infraestructura como código, observabilidad y una búsqueda constante de mejora. Esa curiosidad continúa fuera de producción: en mi clúster Kubernetes self-hosted experimento, rompo cosas, las reconstruyo y transformo cada aprendizaje en algo mejor. Para mí, la tecnología es mucho más que sistemas y código; es una forma de generar un impacto real y duradero. Mi ambición es dejar una huella en el mundo a través de mi profesión: construyendo soluciones que perduren, compartiendo lo que aprendo y ayudando a otros a crecer en el camino."

